org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Termux-on-Android builds need a native ARM64 aapt2 (AGP's bundled one is x86_64 and
# cannot run there). That override lives in `gradle.termux.properties` and is only
# applied locally — never on CI, where the bundled aapt2 works fine.
